name: Build macOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS app
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: "${{ vars.TATER_TUNNEL_DEVELOPER_DIR || '/Applications/Xcode.app/Contents/Developer' }}"
      TATER_TUNNEL_CODESIGN_IDENTITY: "${{ vars.TATER_TUNNEL_CODESIGN_IDENTITY || 'Developer ID Application: Tater Totterson AI LLC (8BHV7Y2D9D)' }}"
      TATER_TUNNEL_NOTARIZE: "${{ vars.TATER_TUNNEL_NOTARIZE || '0' }}"
      TATER_TUNNEL_NOTARY_PROFILE: "${{ vars.TATER_TUNNEL_NOTARY_PROFILE || 'tater-notary' }}"
      TATER_TUNNEL_APP_PROFILE: "${{ vars.TATER_TUNNEL_APP_PROFILE }}"
      TATER_TUNNEL_EXTENSION_PROFILE: "${{ vars.TATER_TUNNEL_EXTENSION_PROFILE }}"
      TATER_TUNNEL_APP_PROFILE_BASE64: "${{ secrets.TATER_TUNNEL_APP_PROFILE_BASE64 }}"
      TATER_TUNNEL_EXTENSION_PROFILE_BASE64: "${{ secrets.TATER_TUNNEL_EXTENSION_PROFILE_BASE64 }}"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/TaterTunnel/Resources/Info.plist)"
          expected_tag="v${version#v}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match macOS app version ${expected_tag}." >&2
            exit 1
          fi

      - name: Install macOS build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          if ! command -v go >/dev/null 2>&1; then
            brew install go
          fi
          xcodegen --version
          go version

      - name: Install Network Extension signing profiles
        shell: bash
        run: macos/TaterTunnel/scripts/install_signing_profiles.sh

      - name: Build updater package
        shell: bash
        run: macos/TaterTunnel/scripts/package_update.sh

      - name: Build installer DMG
        shell: bash
        run: macos/TaterTunnel/scripts/build_dmg.sh

      - name: Collect artifact metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/TaterTunnel/Resources/Info.plist)"
          version_token="${version#v}"
          version_label="v${version_token}"
          zip_path="macos/TaterTunnel/releases/TaterTunnel-${version_label}.zip"
          dmg_path="macos/TaterTunnel/releases/TaterTunnel-${version_label}.dmg"
          test -f "${zip_path}"
          test -f "${dmg_path}"
          echo "version_label=${version_label}" >> "${GITHUB_OUTPUT}"
          echo "zip_path=${zip_path}" >> "${GITHUB_OUTPUT}"
          echo "dmg_path=${dmg_path}" >> "${GITHUB_OUTPUT}"
          echo "manifest_path=macos/TaterTunnel/update-manifest.json" >> "${GITHUB_OUTPUT}"
          shasum -a 256 "${zip_path}" "${dmg_path}" "macos/TaterTunnel/update-manifest.json"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TaterTunnel-macOS-${{ steps.meta.outputs.version_label }}
          if-no-files-found: error
          path: |
            ${{ steps.meta.outputs.zip_path }}
            ${{ steps.meta.outputs.dmg_path }}
            ${{ steps.meta.outputs.manifest_path }}

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VERSION_LABEL: ${{ steps.meta.outputs.version_label }}
          ZIP_PATH: ${{ steps.meta.outputs.zip_path }}
          DMG_PATH: ${{ steps.meta.outputs.dmg_path }}
          MANIFEST_PATH: ${{ steps.meta.outputs.manifest_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          tag="${GITHUB_REF_NAME}"
          api_url="https://api.github.com/repos/${repo}"
          upload_url="https://uploads.github.com/repos/${repo}"
          auth_header="Authorization: Bearer ${GITHUB_TOKEN}"
          api_headers=(
            -H "${auth_header}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          json_id() {
            /usr/bin/python3 -c 'import json, sys; print(json.load(sys.stdin).get("id", ""))' 2>/dev/null || true
          }

          release_body="$(/usr/bin/python3 -c 'import json, os, pathlib; print(json.dumps({
            "tag_name": os.environ["GITHUB_REF_NAME"],
            "name": "Tater Tunnel " + os.environ["VERSION_LABEL"],
            "draft": False,
            "prerelease": False,
            "make_latest": "true",
            "body": pathlib.Path("RELEASE_NOTES.md").read_text(encoding="utf-8"),
          }))')"
          release_id="$(curl -fsS "${api_headers[@]}" "${api_url}/releases/tags/${tag}" | json_id || true)"
          if [[ -z "${release_id}" ]]; then
            release_id="$(curl -fsS \
              -X POST \
              "${api_headers[@]}" \
              -H "Content-Type: application/json" \
              --data "${release_body}" \
              "${api_url}/releases" | json_id)"
          else
            curl -fsS \
              -X PATCH \
              "${api_headers[@]}" \
              -H "Content-Type: application/json" \
              --data "${release_body}" \
              "${api_url}/releases/${release_id}" >/dev/null
          fi

          upload_asset() {
            local path="$1"
            local content_type="$2"
            local name
            local encoded_name
            local existing_id
            name="$(basename "${path}")"
            encoded_name="$(/usr/bin/python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "${name}")"
            existing_id="$(curl -fsS "${api_headers[@]}" "${api_url}/releases/${release_id}/assets?per_page=100" \
              | /usr/bin/python3 -c 'import json, sys; target = sys.argv[1]; print(next((str(asset.get("id", "")) for asset in json.load(sys.stdin) if asset.get("name") == target), ""))' "${name}" 2>/dev/null || true)"
            if [[ -n "${existing_id}" ]]; then
              curl -fsS -X DELETE "${api_headers[@]}" "${api_url}/releases/assets/${existing_id}" >/dev/null
            fi
            for attempt in 1 2 3; do
              local response_path
              local status
              response_path="$(mktemp)"
              status="$(curl --http1.1 -sS -L \
                -w "%{http_code}" \
                -o "${response_path}" \
                -X POST \
                "${api_headers[@]}" \
                -H "Content-Type: ${content_type}" \
                --data-binary @"${path}" \
                "${upload_url}/releases/${release_id}/assets?name=${encoded_name}")"
              if [[ "${status}" =~ ^2 ]]; then
                /usr/bin/python3 -c 'import json, sys; print("uploaded " + json.load(open(sys.argv[1])).get("name", ""))' "${response_path}"
                rm -f "${response_path}"
                return 0
              fi
              echo "Release asset upload failed for ${name} with HTTP ${status} on attempt ${attempt}." >&2
              cat "${response_path}" >&2 || true
              rm -f "${response_path}"
              if [[ "${attempt}" != "3" ]]; then
                sleep 10
              fi
            done
            return 1
          }

          upload_asset "${ZIP_PATH}" "application/zip"
          upload_asset "${DMG_PATH}" "application/x-apple-diskimage"
          upload_asset "${MANIFEST_PATH}" "application/json"
